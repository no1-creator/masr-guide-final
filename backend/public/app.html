<!DOCTYPE html>
<!-- RAGO-V3-CLEAN -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masr Guide — Egypt Travel Services</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#123B4C;--blue-h:#0E2E3B;--green:#2E8B7B;--gold:#E8850F;
  --red:#E05544;--text:#1B2A30;--text2:#6B7B85;
  --border:#E4E7E9;--soft:#F7F9FA;--r:14px;
  --shadow:0 2px 12px rgba(18,59,76,.10);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}

/* NAV */
#topnav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:60px;
  background:#fff;border-bottom:1px solid var(--border);
  box-shadow:0 1px 6px rgba(18,59,76,.06);
}
#logo{font-size:20px;font-weight:800;color:var(--blue);letter-spacing:-.5px;margin-right:auto}
#logo span{color:var(--gold)}
#nav-search{
  flex:1;max-width:340px;
  display:flex;align-items:center;gap:8px;
  background:var(--soft);border:1.5px solid var(--border);border-radius:10px;
  padding:0 12px;height:38px;
}
#nav-search input{
  border:none;background:none;outline:none;flex:1;
  font-size:14px;color:var(--text);
}
#nav-search svg{opacity:.45;flex:0 0 auto}
#nav-auth{display:flex;gap:8px;align-items:center}
.btn-nav{
  padding:7px 16px;border-radius:9px;font-size:13px;font-weight:700;
  border:1.5px solid var(--blue);color:var(--blue);transition:all .15s;
}
.btn-nav:hover{background:var(--blue);color:#fff}
.btn-nav.primary{background:var(--blue);color:#fff}
.btn-nav.primary:hover{background:var(--blue-h)}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* HOME */
#home{padding:0}

/* HERO */
#hero{
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-h) 60%,#0a1f28 100%);
  color:#fff;padding:60px 20px 50px;text-align:center;
}
#hero h1{font-size:clamp(26px,5vw,42px);font-weight:900;margin-bottom:12px;letter-spacing:-.5px}
#hero p{font-size:16px;opacity:.8;margin-bottom:30px;max-width:500px;margin-left:auto;margin-right:auto}
#hero-search{
  display:flex;max-width:480px;margin:0 auto;
  background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}
#hero-search input{
  flex:1;padding:14px 18px;border:none;outline:none;
  font-size:15px;color:var(--text);
}
#hero-search button{
  padding:0 22px;background:var(--gold);color:#fff;
  font-weight:800;font-size:14px;cursor:pointer;border:none;
  transition:background .15s;
}
#hero-search button:hover{background:#d4760d}

/* CATEGORIES GRID */
#cats-section{padding:40px 20px}
#cats-section h2{font-size:22px;font-weight:800;margin-bottom:20px;color:var(--text)}
#cats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:14px;
}
.cat-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:20px 10px;border-radius:var(--r);
  background:var(--soft);border:1.5px solid var(--border);
  cursor:pointer;transition:all .2s;text-align:center;
}
.cat-card:hover{
  border-color:var(--blue);background:#fff;
  transform:translateY(-3px);box-shadow:var(--shadow);
}
.cat-card .icon{font-size:28px}
.cat-card .label{font-size:13px;font-weight:700;color:var(--text)}
.cat-card .count{font-size:11px;color:var(--text2)}

/* CATEGORY PAGE */
#cat-page{padding:0}
#cat-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;border-bottom:1px solid var(--border);
  background:#fff;position:sticky;top:60px;z-index:50;
}
#cat-header h2{font-size:18px;font-weight:800;flex:1}
#back-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:9px;
  background:var(--soft);border:1.5px solid var(--border);
  font-size:13px;font-weight:700;color:var(--text2);
  cursor:pointer;transition:all .15s;
}
#back-btn:hover{border-color:var(--blue);color:var(--blue)}
#services-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;padding:24px 20px;
}
.svc-card{
  border-radius:var(--r);overflow:hidden;
  border:1.5px solid var(--border);background:#fff;
  box-shadow:0 1px 4px rgba(18,59,76,.05);
  cursor:pointer;transition:all .2s;
}
.svc-card:hover{
  border-color:var(--blue);
  transform:translateY(-3px);box-shadow:var(--shadow);
}
.svc-card img{
  width:100%;height:180px;object-fit:cover;
  background:var(--soft);
}
.svc-card-body{padding:14px}
.svc-card-body h3{font-size:15px;font-weight:800;margin-bottom:6px;color:var(--text)}
.svc-card-body .meta{font-size:12px;color:var(--text2);margin-bottom:10px}
.svc-card-body .price{
  font-size:16px;font-weight:900;color:var(--blue);
}
.svc-card-body .price span{font-size:12px;font-weight:400;color:var(--text2)}
.svc-card-body .rating{font-size:12px;color:var(--gold);font-weight:700}

/* SERVICE DETAIL PAGE */
#detail-page{padding:0}
#detail-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;border-bottom:1px solid var(--border);
  background:#fff;position:sticky;top:60px;z-index:50;
}
#detail-header h2{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail-back{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:9px;
  background:var(--soft);border:1.5px solid var(--border);
  font-size:13px;font-weight:700;color:var(--text2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
#detail-back:hover{border-color:var(--blue);color:var(--blue)}
#detail-body{max-width:860px;margin:0 auto;padding:24px 20px 60px}
#detail-img{
  width:100%;border-radius:var(--r);margin-bottom:22px;
  max-height:380px;object-fit:cover;background:var(--soft);
}
#detail-price-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:12px;
}
#detail-price{font-size:26px;font-weight:900;color:var(--blue)}
#detail-price span{font-size:14px;font-weight:400;color:var(--text2)}
#book-btn{
  padding:13px 30px;border-radius:11px;
  background:linear-gradient(135deg,var(--blue),var(--blue-h));
  color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 6px 18px rgba(18,59,76,.22);
  transition:all .15s;
}
#book-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(18,59,76,.28)}
#detail-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.detail-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;
  background:var(--soft);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text2);
}
#detail-desc{
  font-size:15px;line-height:1.7;color:var(--text);
  margin-bottom:20px;
}
#detail-vendor{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:var(--r);
  background:var(--soft);border:1px solid var(--border);
  margin-bottom:20px;
}
#detail-vendor .vname{font-weight:800;font-size:14px}
#detail-vendor .vrole{font-size:12px;color:var(--text2)}

/* STATES */
.loading{
  display:flex;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--text2);font-size:15px;gap:10px;
}
.loading::before{
  content:'';width:22px;height:22px;
  border:3px solid var(--border);
  border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
  text-align:center;padding:60px 20px;
  color:var(--text2);font-size:15px;
}

/* DASHBOARD (minimal placeholder) */
#dash-view{
  padding:30px 20px;max-width:1000px;margin:0 auto;
}

/* AUTH MODAL */
#auth-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.5);align-items:center;justify-content:center;
}
#auth-overlay.open{display:flex}
#auth-box{
  background:#fff;border-radius:18px;padding:32px;
  width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);
  position:relative;
}
#auth-close{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  background:var(--soft);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--text2);
}
#auth-close:hover{background:var(--border)}
#auth-box h3{font-size:20px;font-weight:900;margin-bottom:6px}
#auth-box p{font-size:13px;color:var(--text2);margin-bottom:22px}
.auth-input{
  width:100%;padding:12px 14px;margin-bottom:12px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;outline:none;font-family:inherit;
  transition:border-color .15s;
}
.auth-input:focus{border-color:var(--blue)}
.btn-auth{
  width:100%;padding:13px;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--blue-h));
  color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;border:none;font-family:inherit;
  transition:all .15s;
}
.btn-auth:hover{opacity:.92}
.auth-err{color:var(--red);font-size:13px;margin-bottom:10px;display:none}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2)}
.auth-switch a{color:var(--blue);font-weight:700;cursor:pointer}

/* TOAST */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1B2A30;color:#fff;padding:12px 22px;
  border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:300;
  white-space:nowrap;
}
#toast.show{opacity:1}

@media(max-width:600px){
  #cats-grid{grid-template-columns:repeat(3,1fr)}
  #services-grid{grid-template-columns:1fr}
  #nav-search{display:none}
}
</style>
</head>
<body>

<!-- NAV -->
<nav id="topnav">
  <div id="logo">Masr<span>Guide</span></div>
  <div id="nav-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Search services..." id="search-input" autocomplete="off">
  </div>
  <div id="nav-auth">
    <button class="btn-nav" id="login-btn" onclick="openAuth('login')">Login</button>
    <button class="btn-nav primary" id="register-btn" onclick="openAuth('register')">Sign Up</button>
    <button class="btn-nav primary" id="dashboard-btn" style="display:none" onclick="goToDashboard()">Dashboard</button>
    <button class="btn-nav" id="logout-btn" style="display:none" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- HOME PAGE -->
<div class="page" id="home">
  <div id="hero">
    <h1>Discover Egypt Like Never Before</h1>
    <p>Book flights, tours, hotels, transfers and more — all in one place</p>
    <div id="hero-search">
      <input type="text" placeholder="Search for a service..." id="hero-input" autocomplete="off">
      <button onclick="doSearch()">Search</button>
    </div>
  </div>
  <div id="cats-section">
    <h2>Browse by Category</h2>
    <div id="cats-grid"></div>
  </div>
</div>

<!-- CATEGORY PAGE -->
<div class="page" id="cat-page">
  <div id="cat-header">
    <button id="back-btn" onclick="goHome()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back
    </button>
    <h2 id="cat-title">Services</h2>
  </div>
  <div id="services-grid"></div>
</div>

<!-- SERVICE DETAIL PAGE -->
<div class="page" id="detail-page">
  <div id="detail-header">
    <button id="detail-back" onclick="goBackFromDetail()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back
    </button>
    <h2 id="detail-header-title">Service Detail</h2>
  </div>
  <div id="detail-body"></div>
</div>

<!-- DASHBOARD PAGE -->
<div class="page" id="dash-page">
  <div id="dash-view"><p class="loading">Loading dashboard...</p></div>
</div>

<!-- AUTH MODAL -->
<div id="auth-overlay">
  <div id="auth-box">
    <button id="auth-close" onclick="closeAuth()">×</button>
    <h3 id="auth-title">Welcome back</h3>
    <p id="auth-sub">Sign in to your account</p>
    <div id="auth-err" class="auth-err"></div>
    <div id="reg-name-wrap" style="display:none">
      <input class="auth-input" id="auth-name" type="text" placeholder="Full name">
    </div>
    <input class="auth-input" id="auth-email" type="email" placeholder="Email address">
    <input class="auth-input" id="auth-pass" type="password" placeholder="Password">
    <button class="btn-auth" id="auth-submit" onclick="submitAuth()">Sign In</button>
    <div class="auth-switch" id="auth-switch">
      Don’t have an account? <a onclick="openAuth('register')">Sign up</a>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
const API = ''  // same origin
let TOKEN = localStorage.getItem('mg_token') || ''
let USER  = null
let CATS  = []
let SERVICES_CACHE = {}  // cat -> []
let _detailFromCat = null  // to know where to go back from detail

const CAT_ICONS = {
  airport:'\u2708\ufe0f', visa:'\ud83d\udcce', transfers:'\ud83d\ude95', hotels:'\ud83c\udfe8',
  'internal-trips':'\ud83d\ude8c', tours:'\ud83d\uddfa\ufe0f', 'nile-cruise':'\ud83d\udea4',
  diving:'\ud83e\udd3f', safari:'\ud83e\udd81', carrental:'\ud83d\ude97',
  guide:'\ud83e\uddd1\u200d\ud83d\udcbc', sim:'\ud83d\udcf1', dining:'\ud83c\udf7d\ufe0f',
  shopping:'\ud83d\udecd\ufe0f', spa:'\ud83d\udea1', events:'\ud83c\udf89',
  insurance:'\ud83d\udee1\ufe0f', departure:'\ud83d\udece\ufe0f', pharmacy:'\ud83d\udc8a'
}

// ============================================================
// ROUTER — reads URL on load and after back/forward
// ============================================================
function router() {
  const p = new URLSearchParams(location.search)
  const s = p.get('s')    // service detail
  const c = p.get('cat')  // category
  const d = p.get('dash') // dashboard

  if (s) {
    showDetailById(s)
  } else if (c) {
    showCategoryByKey(c)
  } else if (d) {
    showDash()
  } else {
    showHome()
  }
}

window.addEventListener('popstate', router)

// ============================================================
// NAV HELPERS (real URL change = 100% reliable)
// ============================================================
function goHome() {
  history.pushState(null, '', '/')
  showHome()
}
function goToCat(catKey) {
  _detailFromCat = catKey
  history.pushState(null, '', '/?cat=' + encodeURIComponent(catKey))
  showCategoryByKey(catKey)
}
function goToDetail(id, catKey) {
  _detailFromCat = catKey || null
  history.pushState(null, '', '/?s=' + id)
  showDetailById(id)
}
function goBackFromDetail() {
  if (_detailFromCat) {
    history.pushState(null, '', '/?cat=' + encodeURIComponent(_detailFromCat))
    showCategoryByKey(_detailFromCat)
  } else {
    goHome()
  }
}
function goToDashboard() {
  history.pushState(null, '', '/?dash=1')
  showDash()
}

// ============================================================
// PAGE SWITCHER
// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  window.scrollTo(0, 0)
}

// ============================================================
// HOME
// ============================================================
async function showHome() {
  showPage('home')
  if (CATS.length === 0) await loadCats()
  renderCats()
}

async function loadCats() {
  try {
    const r = await apiFetch('/api/categories')
    CATS = r
  } catch(e) {
    console.error('cats', e)
  }
}

function renderCats() {
  const grid = document.getElementById('cats-grid')
  if (!CATS.length) { grid.innerHTML = '<p class="empty">No categories found</p>'; return }
  grid.innerHTML = CATS.map(c => {
    const icon = CAT_ICONS[c.key] || '\ud83d\udcc2'
    const label = (c.labels && (c.labels.en || Object.values(c.labels)[0])) || c.key
    return `<div class="cat-card" onclick="goToCat('${c.key}')">
      <div class="icon">${icon}</div>
      <div class="label">${esc(label)}</div>
    </div>`
  }).join('')
}

// ============================================================
// CATEGORY PAGE
// ============================================================
async function showCategoryByKey(key) {
  showPage('cat-page')
  const cat = CATS.find(c => c.key === key)
  const label = cat
    ? ((cat.labels && (cat.labels.en || Object.values(cat.labels)[0])) || key)
    : key
  document.getElementById('cat-title').textContent = label
  _detailFromCat = key

  const grid = document.getElementById('services-grid')
  grid.innerHTML = '<div class="loading"></div>'

  if (!SERVICES_CACHE[key]) {
    try {
      const data = await apiFetch('/api/services?category=' + encodeURIComponent(key) + '&limit=50')
      SERVICES_CACHE[key] = Array.isArray(data) ? data : (data.services || data.items || [])
    } catch(e) {
      grid.innerHTML = '<p class="empty">Failed to load services</p>'
      return
    }
  }

  const svcs = SERVICES_CACHE[key]
  if (!svcs.length) { grid.innerHTML = '<p class="empty">No services in this category</p>'; return }

  grid.innerHTML = svcs.map(s => {
    const img = (s.images && s.images[0]) || s.image || 'https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?w=600&q=80'
    const price = s.price_from || s.price || s.base_price || 0
    const currency = s.currency || 'USD'
    const rating = s.avg_rating || s.rating || 0
    return `<div class="svc-card" onclick="goToDetail(${s.id},'${key}')">
      <img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.background='var(--soft)'">
      <div class="svc-card-body">
        <h3>${esc(s.title || s.name || 'Service')}</h3>
        <div class="meta">${esc(s.location || s.city || '')}</div>
        ${rating > 0 ? `<div class="rating">${'\u2605'.repeat(Math.round(rating))} ${(+rating).toFixed(1)}</div>` : ''}
        <div class="price">${currency} ${(+price).toFixed(0)} <span>/ person</span></div>
      </div>
    </div>`
  }).join('')
}

// ============================================================
// SERVICE DETAIL
// ============================================================
async function showDetailById(id) {
  showPage('detail-page')
  document.getElementById('detail-header-title').textContent = 'Loading...'
  const body = document.getElementById('detail-body')
  body.innerHTML = '<div class="loading"></div>'

  let svc
  // check cache first
  for (const svcs of Object.values(SERVICES_CACHE)) {
    svc = svcs.find(s => String(s.id) === String(id))
    if (svc) break
  }

  if (!svc) {
    try {
      svc = await apiFetch('/api/services/' + id)
    } catch(e) {
      body.innerHTML = '<p class="empty">Service not found</p>'
      return
    }
  }

  document.getElementById('detail-header-title').textContent = svc.title || svc.name || 'Service'
  const img = (svc.images && svc.images[0]) || svc.image || 'https://images.unsplash.com/photo-1568322445389-f64ac2515020?w=900&q=80'
  const price = svc.price_from || svc.price || svc.base_price || 0
  const currency = svc.currency || 'USD'
  const rating = svc.avg_rating || svc.rating || 0
  const vendor = svc.vendor_name || svc.vendor || ''
  const desc = svc.description || svc.desc || ''
  const duration = svc.duration || ''
  const location = svc.location || svc.city || ''

  body.innerHTML = `
    <img id="detail-img" src="${esc(img)}" alt="" onerror="this.style.background='var(--soft)'">
    <h1 style="font-size:24px;font-weight:900;margin-bottom:10px">${esc(svc.title || svc.name || 'Service')}</h1>
    <div id="detail-meta">
      ${location ? `<span class="detail-badge">📍 ${esc(location)}</span>` : ''}
      ${duration ? `<span class="detail-badge">⏱ ${esc(duration)}</span>` : ''}
      ${rating > 0 ? `<span class="detail-badge" style="color:var(--gold)">★ ${(+rating).toFixed(1)}</span>` : ''}
      ${svc.category_key ? `<span class="detail-badge">${CAT_ICONS[svc.category_key] || ''} ${esc(svc.category_key)}</span>` : ''}
    </div>
    <div id="detail-price-row">
      <div id="detail-price">${currency} ${(+price).toFixed(0)} <span>/ person</span></div>
      <button id="book-btn" onclick="bookNow(${svc.id})">Book Now</button>
    </div>
    ${vendor ? `<div id="detail-vendor">
      <div>
        <div class="vname">🏢 ${esc(vendor)}</div>
        <div class="vrole">Service Provider</div>
      </div>
    </div>` : ''}
    ${desc ? `<div id="detail-desc">${esc(desc)}</div>` : ''}
  `
}

// ============================================================
// DASHBOARD
// ============================================================
function showDash() {
  if (!USER) { openAuth('login'); return }
  showPage('dash-page')
  document.getElementById('dash-view').innerHTML = `
    <h2 style="font-size:22px;font-weight:900;margin-bottom:20px">Dashboard</h2>

    <p style="margin-top:12px;color:var(--text2)">Role: <strong>${esc(USER.role)}</strong></p>
  `
}

// ============================================================
// SEARCH
// ============================================================
function doSearch() {
  const q = (document.getElementById('hero-input').value || document.getElementById('search-input').value).trim()
  if (!q) return
  toast('Search: ' + q + ' — coming soon!')
}
document.getElementById('hero-input').addEventListener('keydown', e => e.key==='Enter' && doSearch())
document.getElementById('search-input').addEventListener('keydown', e => e.key==='Enter' && doSearch())

// ============================================================
// AUTH
// ============================================================
let authMode = 'login'

function openAuth(mode) {
  authMode = mode || 'login'
  const overlay = document.getElementById('auth-overlay')
  overlay.classList.add('open')
  document.getElementById('auth-err').style.display = 'none'
  document.getElementById('auth-err').textContent = ''
  document.getElementById('auth-email').value = ''
  document.getElementById('auth-pass').value = ''
  document.getElementById('auth-name').value = ''
  if (authMode === 'register') {
    document.getElementById('auth-title').textContent = 'Create account'
    document.getElementById('auth-sub').textContent = 'Join Masr Guide today'
    document.getElementById('reg-name-wrap').style.display = 'block'
    document.getElementById('auth-submit').textContent = 'Sign Up'
    document.getElementById('auth-switch').innerHTML = 'Already have an account? <a onclick="openAuth(\'login\')">Sign in</a>'
  } else {
    document.getElementById('auth-title').textContent = 'Welcome back'
    document.getElementById('auth-sub').textContent = 'Sign in to your account'
    document.getElementById('reg-name-wrap').style.display = 'none'
    document.getElementById('auth-submit').textContent = 'Sign In'
    document.getElementById('auth-switch').innerHTML = 'Don’t have an account? <a onclick="openAuth(\'register\')">Sign up</a>'
  }
  document.getElementById('auth-email').focus()
}

function closeAuth() {
  document.getElementById('auth-overlay').classList.remove('open')
}

document.getElementById('auth-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('auth-overlay')) closeAuth()
})

async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim()
  const pass  = document.getElementById('auth-pass').value
  const name  = document.getElementById('auth-name').value.trim()
  const errEl = document.getElementById('auth-err')
  errEl.style.display = 'none'

  if (!email || !pass) { errEl.textContent = 'Please fill all fields'; errEl.style.display = 'block'; return }

  const btn = document.getElementById('auth-submit')
  btn.textContent = 'Please wait...'
  btn.disabled = true

  try {
    const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login'
    const payload  = authMode === 'register' ? {name, email, password: pass} : {email, password: pass}
    const data = await apiFetch(endpoint, 'POST', payload)
    if (data.token) {
      TOKEN = data.token
      USER  = data.user
      localStorage.setItem('mg_token', TOKEN)
      closeAuth()
      updateNavAuth()
      toast('Welcome, ' + (USER.name || USER.email) + '!')
    } else {
      errEl.textContent = data.error || 'Authentication failed'
      errEl.style.display = 'block'
    }
  } catch(e) {
    errEl.textContent = e.message || 'Network error'
    errEl.style.display = 'block'
  } finally {
    btn.disabled = false
    btn.textContent = authMode === 'register' ? 'Sign Up' : 'Sign In'
  }
}

function logout() {
  TOKEN = ''; USER = null
  localStorage.removeItem('mg_token')
  updateNavAuth()
  goHome()
  toast('Logged out')
}

function updateNavAuth() {
  const loggedIn = !!USER
  document.getElementById('login-btn').style.display = loggedIn ? 'none' : ''
  document.getElementById('register-btn').style.display = loggedIn ? 'none' : ''
  document.getElementById('dashboard-btn').style.display = loggedIn ? '' : 'none'
  document.getElementById('logout-btn').style.display = loggedIn ? '' : 'none'
}

// ============================================================
// API
// ============================================================
async function apiFetch(path, method, body) {
  const opts = { method: method || 'GET', headers: {} }
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN
  if (body) {
    opts.headers['Content-Type'] = 'application/json'
    opts.body = JSON.stringify(body)
  }
  const res = await fetch(API + path, opts)
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || 'Request failed')
  return data
}

// ============================================================
// TOAST
// ============================================================
let toastTimer
function toast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000)
}

// ============================================================
// UTILS
// ============================================================
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ============================================================
// RESTORE SESSION
// ============================================================
async function restoreSession() {
  if (!TOKEN) return
  try {
    const data = await apiFetch('/api/auth/me')
    USER = data.user || data
    updateNavAuth()
  } catch {
    TOKEN = ''
    localStorage.removeItem('mg_token')
  }
}

// ============================================================
// INIT
// ============================================================
;(async () => {
  await loadCats()
  await restoreSession()
  router()
})()
